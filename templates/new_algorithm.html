<html>
    <head>Uusi algoritmi</head>

    {% if session.username %}
    <form action="/new_algorithm" method="post">
        <p>
            Algoritmin nimi:
            <input type="text" name="algo_name" maxlength="100" required/>
        </p>
        <p>
            Lähdekoodi:
            <textarea name="source_code" rows="5" cols="40" maxlength="10000" required></textarea>
        </p>
        <p>
            {% for class in all_classes %}
                {{ class }}:
                <select name="classes" required>
                <option value="">(valitse)</option>
                {% for option in all_classes[class] %}
                <option value="{{ class }}:{{ option }}">{{ option }}</option>
                {% endfor %}
                </select>
            {% endfor %}
        </p>
        <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}" />
        <input type="submit" value="Lähetä" />
    </form>
    <p>
        <a href="/">Etusivulle</a>
    </p>
    {% else %}
    <p><a href="/login">Kirjaudu</a> sisään lisätäksesi uuden algoritmin</p>
    {% endif %}
</html>
