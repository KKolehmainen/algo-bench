<html>
    <head>Algoritmi</head>

    <body>
        <p>{{ algo.name }}</p>

        <p>{{ algo.source_code }}</p>
        
        {% if classes %}
        <p>
            Luokat:
            <ul>
                {% for class in classes %}
                <li>{{ class.title }}: {{ class.value }}</li>
                {% endfor %}
            </ul>
        </p>
        {% endif %}

        {% if algo.username == session.username %}
        <p>
            <a href="/edit/{{ algo.id }}">Muokkaa</a>
            <a href="/remove/{{ algo.id }}">Poista</a>
        </p>
        {% endif %}
        <p>
            <a href="/">Etusivulle</a>
        </p>
    </body>
</html>
